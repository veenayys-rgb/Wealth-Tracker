name: Daily Portfolio Fetch

on:
  schedule:
    - cron: "30 17 * * 1-5"   # 11:00 PM IST (17:30 UTC) Mon-Fri
  workflow_dispatch:            # allow manual run from GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: fetcher/requirements.txt

      - name: Install dependencies
        run: pip install -r fetcher/requirements.txt

      - name: Run fetcher
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetcher/run.py
