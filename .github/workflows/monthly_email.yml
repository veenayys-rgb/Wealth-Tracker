name: Monthly Nominee Digest

on:
  schedule:
    - cron: "1 0 1 * *"   # 00:01 UTC on the 1st of every month (~5:31 AM IST)
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: fetcher/requirements.txt

      - name: Install dependencies
        run: pip install -r fetcher/requirements.txt

      - name: Send nominee digest
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python fetcher/survivor_email.py
